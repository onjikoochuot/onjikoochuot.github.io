name: Viko lab
# Replays Viko's engine on real price history for many markets and timeframes, in parallel.
# Results are uploaded as an artifact (one JSON line per setup) for analysis.
on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Market groups, comma separated"
        default: "majors,alts,fx,commod,indices,stocks"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.g.outputs.groups }}
    steps:
      - id: g
        run: echo "groups=$(echo '${{ inputs.groups }}' | jq -Rc 'split(",")')" >> $GITHUB_OUTPUT
  replay:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd app && npm ci --silent
      - run: npx --prefix app esbuild lab/run.ts --bundle --platform=node --format=esm --outfile=lab/dist/run.mjs
      - run: node lab/dist/run.mjs ${{ matrix.group }} lab-${{ matrix.group }}.jsonl
      - uses: actions/upload-artifact@v4
        with: { name: "lab-${{ matrix.group }}", path: "lab-${{ matrix.group }}.jsonl" }
  collect:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: results }
      - name: Analyse and save to the lab-data branch
        run: |
          python3 lab/analyze.py results > report.txt || true
          mkdir -p /tmp/out && cp report.txt /tmp/out/ && cat results/*/*.jsonl | gzip -9 > /tmp/out/setups.jsonl.gz
          git config user.name "viko-lab" && git config user.email "lab@viko.local"
          git fetch origin lab-data || true
          git switch --orphan lab-data-new
          rm -rf ./* .github && cp /tmp/out/* . && mkdir -p runs && cp report.txt runs/${{ github.run_id }}.txt
          git add -A && git commit -qm "Lab run ${{ github.run_id }}"
          git push -f origin HEAD:lab-data
